# 一次推送只跑一条流水线：云端 Lint/Build/Scan/发布，成功后再到 192.168.88.129 部署。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: pylint src --fail-under=8.0

      - name: Set image tag
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/task-manager-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${OWNER}/task-manager-api:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}

      - name: Security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.meta.outputs.latest }}"

      # 本机 git clone github.com 会被 RST；把部署源码随流水线带过去。
      - name: Upload deploy sources
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-src
          include-hidden-files: true
          path: |
            Dockerfile
            .dockerignore
            requirements.txt
            src/
            k8s/
            scripts/

  deploy-local:
    needs: pipeline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download deploy sources from cloud job
        id: artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: deploy-src
          path: deploy-src

      - name: Build, apply, and verify on local Minikube
        run: |
          set -euo pipefail
          ROOT=""
          for d in deploy-src "$GITHUB_WORKSPACE" "$HOME/py_demo" "$HOME/task-manager-api" \
                   "$HOME/actions-runner/_work/task-manager-api/task-manager-api"; do
            if [ -f "$d/scripts/deploy-local.sh" ]; then
              ROOT="$d"
              break
            fi
          done
          if [ -z "$ROOT" ]; then
            echo "云端 artifact 下载失败，且本机没有项目目录。请把仓库放到 ~/py_demo"
            exit 1
          fi
          echo "Using $ROOT"
          cd "$ROOT"
          bash scripts/deploy-local.sh
