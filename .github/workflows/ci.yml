# GitHub Actions：push / PR 到 main 时跑 Lint -> Build -> Trivy。
# 某一步失败默认不会继续后面的步骤。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        # 代码风格检查，分数低于 8.0 视为失败。
        run: pylint src --fail-under=8.0

      - name: Set image tag
        # 作业要求标签：ghcr.io/<username>/task-manager-api:<sha>
        id: meta
        run: echo "image=ghcr.io/${{ github.repository_owner }}/task-manager-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.image }}

      - name: Security scan
        # 扫描镜像 CRITICAL 漏洞；未修复项忽略，避免基础镜像已知洞卡死流水线。
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
