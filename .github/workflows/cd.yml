# 在 192.168.88.129 的 self-hosted runner 上执行 docker build 和 kubectl apply。
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-local:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and apply on local server
        run: bash scripts/deploy-local.sh
