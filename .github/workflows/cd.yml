# 在 192.168.88.129 的 self-hosted runner 上执行 docker build 和 kubectl apply。
# 这台机器经常连不上 github.com:443，所以先尝试 checkout，失败则用本机仓库。
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-local:
    runs-on: self-hosted
    steps:
      - name: Prefer HTTP/1.1 for GitHub
        run: git config --global http.version HTTP/1.1

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v5

      - name: Build and apply on local server
        run: |
          set -euo pipefail
          if [ -f scripts/deploy-local.sh ]; then
            bash scripts/deploy-local.sh
            exit 0
          fi
          for d in "$HOME/py_demo" "$HOME/task-manager-api" \
                   "$HOME/actions-runner/_work/task-manager-api/task-manager-api"; do
            if [ -f "$d/scripts/deploy-local.sh" ]; then
              cd "$d"
              bash scripts/deploy-local.sh
              exit 0
            fi
          done
          echo "GitHub 443 不通，且本机没有项目目录。请把仓库放到 ~/py_demo"
          exit 1
